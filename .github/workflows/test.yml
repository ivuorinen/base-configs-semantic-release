---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
#
# The single definition of "run the test suite". Called by pr-lint.yml (so PRs
# fail before merge) and by publish.yml (so a release cannot ship past a broken
# suite). It exists as a reusable workflow rather than a copied job because the
# two gates must not drift: if the pre-merge gate tests something different from
# the pre-publish gate, the weaker of the two decides what reaches npm.
name: Test

on:
  workflow_call:

permissions: {}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # to check out the repository

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js Environment
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"

      # Pinned rather than floating: `npm install -g` executes the package's
      # install scripts, so an unpinned fetch is arbitrary code execution on the
      # runner. Node 25 unbundled corepack, so this cannot be dropped while
      # .nvmrc pins v26.
      - name: Install and enable corepack
        shell: sh
        run: npm install -g corepack@0.35.0 --force && corepack enable

      - name: Install Dependencies
        shell: bash
        run: yarn install --immutable

      - name: Run Tests
        shell: bash
        run: yarn test
